name: Server Health Check

on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-servers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check servers and update README
        shell: bash
        run: |
          python3 <<'PY'
          import http.client
          import json
          import re
          import socket
          import ssl
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          TIMEOUT = 8
          USER_AGENT = "anisette-ss-health-check/2.1"
          MAX_BODY_BYTES = 8192
          TRUNCATION_MARKER = "[Response body truncated]"

          SECRET_EXACT_KEYS = {
              "authorization", "proxy_authorization", "cookie", "set_cookie",
              "password", "passwd", "pwd", "token", "access_token",
              "refresh_token", "id_token", "auth_token", "bearer_token",
              "api_key", "apikey", "x_api_key", "client_secret", "secret",
              "secret_key", "session", "session_id", "sessionid",
              "private_key", "credential", "credentials"
          }
          SECRET_KEY_SUFFIXES = (
              "_token", "_secret", "_password", "_passwd", "_api_key",
              "_apikey", "_private_key", "_cookie", "_credential", "_credentials"
          )

          ERROR_KEYS = {
              "error", "errors", "err", "errmsg", "error_message",
              "error_code", "fault", "exception", "traceback", "stacktrace"
          }
          STATUS_KEYS = {"status", "state", "result", "outcome"}
          CODE_KEYS = {
              "status", "status_code", "statuscode",
              "http_status", "http_code", "code"
          }
          OFFLINE_STATUS_VALUES = {
              "offline", "down", "unavailable", "unhealthy",
              "internal_server_error", "bad_gateway",
              "service_unavailable", "gateway_timeout"
          }
          ERROR_STATUS_VALUES = {
              "error", "err", "fail", "failed", "failure",
              "timeout", "denied", "forbidden", "unauthorized", "rejected"
          }

          HTML_DOC_RE = re.compile(
              r"(?i)(<!doctype\s+html\b|<html[\s>]|<head[\s>]|<body[\s>]|<title[\s>]|<h1[\s>])"
          )
          SERVER_ERROR_TEXT_RE = re.compile(
              r"(?i)("
              r"\b50[0234]\s+(?:internal\s+server\s+error|bad\s+gateway|"
              r"service\s+(?:temporarily\s+)?unavailable|gateway\s+time-?out)\b"
              r"|\b50[0234]\s+error\b"
              r"|\binternal\s+server\s+error\b"
              r"|\bbad\s+gateway\b"
              r"|\bservice\s+(?:temporarily\s+)?unavailable\b"
              r"|\bgateway\s+time-?out\b"
              r"|\bupstream\s+(?:connect\s+error|request\s+timeout|server\s+error|unavailable)\b"
              r"|\bcloudflare\s+ray\s+id\b"
              r"|\bthe\s+origin\s+web\s+server\s+timed\s+out\b"
              r"|\bnginx/\d+\.\d+"
              r"|\bopenresty(?:/\d+\.\d+)?"
              r")"
          )


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              # Do not follow redirects: one configured server gets one GET only.
              def http_error_302(self, req, fp, code, msg, headers):
                  return None

              http_error_301 = http_error_303 = http_error_307 = http_error_308 = http_error_302


          OPENER = urllib.request.build_opener(NoRedirect())


          def is_secret_key(key):
              normalized = str(key).strip().lower().replace("-", "_")
              return (
                  normalized in SECRET_EXACT_KEYS
                  or normalized.endswith(SECRET_KEY_SUFFIXES)
                  or normalized.startswith("x_auth_")
              )


          def redact_text(value):
              text = str(value)
              text = re.sub(
                  r"-----BEGIN [^-]*PRIVATE KEY-----.*?-----END [^-]*PRIVATE KEY-----",
                  "[REDACTED PRIVATE KEY]",
                  text,
                  flags=re.IGNORECASE | re.DOTALL
              )
              text = re.sub(
                  r"(?i)\b(Bearer|Basic)\s+[A-Za-z0-9._~+/=-]+",
                  r"\1 [REDACTED]",
                  text
              )
              text = re.sub(
                  r"""(?i)\b(authorization|proxy-authorization|cookie|set-cookie|x-api-key)\s*:\s*("[^"]*"|'[^']*'|[^\r\n,}]+)""",
                  r"\1: [REDACTED]",
                  text
              )
              text = re.sub(
                  r"""(?i)\b(password|passwd|access_token|refresh_token|id_token|auth_token|bearer_token|api_key|apikey|x-api-key|client_secret|secret_key|secret|private_key|token|session_id|sessionid)\b(\s*[:=]\s*)("[^"]*"|'[^']*'|[^\s,;&}"']+)""",
                  r"\1\2[REDACTED]",
                  text
              )
              text = re.sub(
                  r"""(?i)([?&](?:access_token|refresh_token|id_token|token|api_key|apikey|key|secret|password|passwd)=)[^&\s"'<>]+""",
                  r"\1[REDACTED]",
                  text
              )
              text = re.sub(
                  r"(https?://)[^/@\s]+:[^/@\s]+@",
                  r"\1[REDACTED]@",
                  text
              )
              return text


          def redact_json(value):
              if isinstance(value, dict):
                  return {
                      key: (
                          "[REDACTED]"
                          if is_secret_key(key)
                          else redact_json(item)
                      )
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [redact_json(item) for item in value]
              if isinstance(value, str):
                  return redact_text(value)
              return value


          def escape_markdown_cell(value):
              text = str(value)
              text = text.replace("|", "/")
              text = text.replace("<", "&lt;").replace(">", "&gt;")
              text = re.sub(r"[\r\n]+", " ", text)
              return text.strip()


          def sanitize_field(value, limit=300):
              text = escape_markdown_cell(redact_text(value))
              if limit is not None and len(text) > limit:
                  return text[:limit].rstrip() + "…"
              return text


          def read_limited(stream):
              raw = stream.read(MAX_BODY_BYTES + 1)
              truncated = len(raw) > MAX_BODY_BYTES
              return raw[:MAX_BODY_BYTES], truncated


          def format_body_detail(raw, truncated):
              if not raw:
                  return "(empty response body)"
              decoded = raw.decode("utf-8", errors="replace")
              try:
                  parsed = json.loads(decoded)
              except (ValueError, TypeError):
                  rendered = redact_text(decoded)
              else:
                  rendered = redact_text(
                      json.dumps(
                          redact_json(parsed),
                          ensure_ascii=False,
                          separators=(",", ":")
                      )
                  )

              rendered = escape_markdown_cell(rendered)
              is_truncated = truncated
              if len(rendered) > MAX_BODY_BYTES:
                  rendered = rendered[:MAX_BODY_BYTES].rstrip()
                  is_truncated = True

              if is_truncated:
                  return f"{rendered} {TRUNCATION_MARKER}"
              return rendered


          def is_json_content_type(content_type):
              if not content_type:
                  return False
              media_type = content_type.split(";", 1)[0].strip().lower()
              return media_type == "application/json" or media_type.endswith("+json")


          def is_html_content_type(content_type):
              if not content_type:
                  return False
              media_type = content_type.split(";", 1)[0].strip().lower()
              return media_type in ("text/html", "application/xhtml+xml")


          def find_json_error(payload, depth=0):
              """Fail-closed inspection of JSON payload for explicit error semantics."""
              if depth > 12:
                  return "UNKNOWN", "JSON nesting depth exceeded safe inspection limit"

              first_unknown = None

              if isinstance(payload, dict):
                  for key, val in payload.items():
                      norm = str(key).strip().lower().replace("-", "_")

                      if norm in ERROR_KEYS and val not in (None, False, "", [], {}):
                          if (
                              (isinstance(val, int) and not isinstance(val, bool) and 500 <= val < 600)
                              or (isinstance(val, str) and SERVER_ERROR_TEXT_RE.search(val))
                          ):
                              return "OFFLINE", f"JSON contains server error field '{key}'"
                          if first_unknown is None:
                              first_unknown = ("UNKNOWN", f"JSON contains error field '{key}'")

                      if norm in ("ok", "success") and val is False:
                          if first_unknown is None:
                              first_unknown = ("UNKNOWN", f"JSON indicates failure ('{key}': false)")

                      if norm in STATUS_KEYS and isinstance(val, str):
                          status_val = val.strip().lower()
                          if status_val in OFFLINE_STATUS_VALUES:
                              return "OFFLINE", f"JSON status indicates service unavailable ('{key}': '{val}')"
                          if status_val in ERROR_STATUS_VALUES and first_unknown is None:
                              first_unknown = ("UNKNOWN", f"JSON status indicates error ('{key}': '{val}')")

                      if norm in CODE_KEYS and isinstance(val, int) and not isinstance(val, bool):
                          if 500 <= val < 600:
                              return "OFFLINE", f"JSON contains HTTP 5xx code ('{key}': {val})"
                          if val >= 400 and first_unknown is None:
                              first_unknown = ("UNKNOWN", f"JSON contains error code ('{key}': {val})")

                      if isinstance(val, str):
                          if SERVER_ERROR_TEXT_RE.search(val):
                              return "OFFLINE", f"JSON field '{key}' contains server/proxy error signature"
                          if HTML_DOC_RE.search(val) and first_unknown is None:
                              first_unknown = ("UNKNOWN", f"JSON field '{key}' contains HTML content")
                      elif isinstance(val, (dict, list)):
                          nested = find_json_error(val, depth + 1)
                          if nested is not None:
                              if nested[0] == "OFFLINE":
                                  return nested
                              if first_unknown is None:
                                  first_unknown = nested

              elif isinstance(payload, list):
                  for item in payload:
                      if isinstance(item, str):
                          if SERVER_ERROR_TEXT_RE.search(item):
                              return "OFFLINE", "JSON array contains server/proxy error signature"
                          if HTML_DOC_RE.search(item) and first_unknown is None:
                              first_unknown = ("UNKNOWN", "JSON array contains HTML content")
                      elif isinstance(item, (dict, list)):
                          nested = find_json_error(item, depth + 1)
                          if nested is not None:
                              if nested[0] == "OFFLINE":
                                  return nested
                              if first_unknown is None:
                                  first_unknown = nested

              return first_unknown


          def evaluate_response(status_code, reason, content_type, raw, truncated):
              ct_safe = sanitize_field(content_type or "missing", 160)
              reason_safe = sanitize_field(reason or "", 160)
              header_prefix = (
                  f"GET /v3/client_info: HTTP {status_code}"
                  f"{' ' + reason_safe if reason_safe else ''}; "
                  f"Content-Type: {ct_safe}"
              )
              body_summary = format_body_detail(raw, truncated)

              if status_code != 200:
                  status = "OFFLINE" if 500 <= status_code < 600 else "UNKNOWN"
                  return status, f"{header_prefix}; unexpected non-200 status; response: {body_summary}"

              if not raw or not raw.strip():
                  return "UNKNOWN", f"{header_prefix}; empty response body"

              try:
                  decoded = raw.decode("utf-8")
              except UnicodeDecodeError as error:
                  return "UNKNOWN", (
                      f"{header_prefix}; response UTF-8 decode failed "
                      f"({type(error).__name__}: {sanitize_field(error, 300)}); "
                      f"response: {body_summary}"
                  )

              has_html = is_html_content_type(content_type) or bool(HTML_DOC_RE.search(decoded))
              has_server_error = bool(SERVER_ERROR_TEXT_RE.search(decoded))

              if has_html and has_server_error:
                  return "OFFLINE", (
                      f"{header_prefix}; HTML/proxy server error page returned with HTTP 200; "
                      f"response: {body_summary}"
                  )
              if has_html:
                  return "UNKNOWN", (
                      f"{header_prefix}; HTML response returned instead of JSON; "
                      f"response: {body_summary}"
                  )

              if truncated:
                  status = "OFFLINE" if has_server_error else "UNKNOWN"
                  return status, (
                      f"{header_prefix}; response exceeded {MAX_BODY_BYTES} bytes limit; "
                      f"response: {body_summary}"
                  )

              if not is_json_content_type(content_type):
                  status = "OFFLINE" if has_server_error else "UNKNOWN"
                  return status, (
                      f"{header_prefix}; unexpected Content-Type (expected JSON); "
                      f"response: {body_summary}"
                  )

              try:
                  payload = json.loads(decoded)
              except json.JSONDecodeError as error:
                  status = "OFFLINE" if has_server_error else "UNKNOWN"
                  return status, (
                      f"{header_prefix}; invalid JSON ({type(error).__name__}: "
                      f"{sanitize_field(error, 300)}); response: {body_summary}"
                  )

              if not isinstance(payload, dict):
                  return "UNKNOWN", (
                      f"{header_prefix}; JSON root must be an object "
                      f"(got {type(payload).__name__}); response: {body_summary}"
                  )

              json_error = find_json_error(payload)
              if json_error is not None:
                  err_status, err_reason = json_error
                  return err_status, (
                      f"{header_prefix}; {err_reason}; response: {body_summary}"
                  )

              missing = [field for field in ("client_info", "user_agent") if field not in payload]
              if missing:
                  return "UNKNOWN", (
                      f"{header_prefix}; missing required field(s): {', '.join(missing)}; "
                      f"response: {body_summary}"
                  )

              invalid = []
              for field in ("client_info", "user_agent"):
                  val = payload[field]
                  if not isinstance(val, str) or not val.strip():
                      invalid.append(f"{field} (got {type(val).__name__})")
              if invalid:
                  return "UNKNOWN", (
                      f"{header_prefix}; invalid required field(s): {', '.join(invalid)}; "
                      f"response: {body_summary}"
                  )

              return "ONLINE", (
                  "GET /v3/client_info: HTTP 200; valid JSON with required fields. "
                  "Apple provisioning not tested."
              )


          def evaluate_http_error(error):
              try:
                  try:
                      raw, truncated = read_limited(error)
                      body_summary = format_body_detail(raw, truncated)
                  except Exception as read_error:
                      body_summary = (
                          f"(could not read error response body: "
                          f"{type(read_error).__name__}: {sanitize_field(read_error, 300)})"
                      )
              finally:
                  try:
                      error.close()
                  except Exception:
                      pass

              headers = error.headers
              content_type = headers.get("Content-Type", "missing") if headers else "missing"
              location = headers.get("Location", "") if headers else ""

              parts = [
                  f"HTTP {error.code} {sanitize_field(error.reason, 200)}".strip(),
                  f"Content-Type: {sanitize_field(content_type, 160)}"
              ]
              if 300 <= error.code < 400 and location:
                  parts.append(f"Location: {sanitize_field(location, 300)}")
              parts.append(f"response: {body_summary}")

              if 500 <= error.code < 600:
                  return "OFFLINE", "; ".join(parts)
              if 300 <= error.code < 400:
                  parts.append("no redirect follow performed")
                  return "UNKNOWN", "; ".join(parts)
              if error.code in (401, 403, 429):
                  parts.append("access/rate limit respected; no retry performed")
                  return "UNKNOWN", "; ".join(parts)
              return "UNKNOWN", "; ".join(parts)


          def classify_exception(error):
              outer_type = type(error).__name__
              target = error
              if isinstance(error, urllib.error.URLError) and isinstance(error.reason, BaseException):
                  target = error.reason

              target_type = type(target).__name__
              type_label = (
                  f"{outer_type}->{target_type}"
                  if target is not error else outer_type
              )
              msg = sanitize_field(target, 600)

              if isinstance(target, ssl.SSLCertVerificationError):
                  return "UNKNOWN", f"TLS certificate verification failed ({type_label}): {msg}"
              if isinstance(target, ssl.SSLError):
                  return "UNKNOWN", f"TLS/SSL error ({type_label}): {msg}"
              if isinstance(target, socket.gaierror):
                  return "OFFLINE", f"DNS resolution failed ({type_label}): {msg}"
              if isinstance(target, (socket.timeout, TimeoutError)):
                  return "OFFLINE", f"Connection/read timeout ({type_label}): {msg}"
              if isinstance(target, http.client.RemoteDisconnected):
                  return "OFFLINE", f"Remote disconnected ({type_label}): {msg}"
              if isinstance(target, ConnectionRefusedError):
                  return "OFFLINE", f"Connection refused ({type_label}): {msg}"
              if isinstance(target, ConnectionResetError):
                  return "OFFLINE", f"Connection reset ({type_label}): {msg}"
              if isinstance(target, ConnectionAbortedError):
                  return "OFFLINE", f"Connection aborted ({type_label}): {msg}"
              if isinstance(target, ConnectionError):
                  return "OFFLINE", f"Connection error ({type_label}): {msg}"
              if isinstance(target, UnicodeDecodeError):
                  return "UNKNOWN", f"Response decode error ({type_label}): {msg}"
              if isinstance(target, json.JSONDecodeError):
                  return "UNKNOWN", f"JSON decode error ({type_label}): {msg}"
              if isinstance(target, http.client.HTTPException):
                  return "UNKNOWN", f"HTTP protocol error ({type_label}): {msg}"
              if isinstance(error, urllib.error.URLError):
                  return "UNKNOWN", f"URL error ({type_label}): {msg}"
              if isinstance(target, OSError):
                  return "UNKNOWN", f"Network/OS error ({type_label}): {msg}"
              return "UNKNOWN", f"Unexpected error ({type_label}): {msg}"


          def check_server(server):
              name = server.get("name", "(unnamed server)")
              base_url = str(server.get("address", "")).strip().rstrip("/")
              print(f"Checking {name}: {base_url}")

              if not base_url.startswith(("http://", "https://")):
                  return "UNKNOWN", f"Invalid server address: {sanitize_field(base_url, 300)}"

              endpoint = base_url + "/v3/client_info"
              try:
                  request = urllib.request.Request(
                      endpoint,
                      headers={"User-Agent": USER_AGENT},
                      method="GET"
                  )
                  with OPENER.open(request, timeout=TIMEOUT) as response:
                      status_code = response.status
                      reason = getattr(response, "reason", "")
                      content_type = response.headers.get("Content-Type", "")
                      raw, truncated = read_limited(response)
                  return evaluate_response(status_code, reason, content_type, raw, truncated)
              except urllib.error.HTTPError as error:
                  return evaluate_http_error(error)
              except Exception as error:
                  return classify_exception(error)


          def build_report(results, checked_at):
              lines = [
                  "<!-- SERVER_STATUS_START -->",
                  "## Server Status",
                  "",
                  f"_Last checked: {checked_at}_",
                  "",
                  "| Server | Address | Status | Details |",
                  "|---|---|---|---|"
              ]

              for item in results:
                  name = sanitize_field(item["name"], 160)
                  url = sanitize_field(item["url"], 300)
                  status = sanitize_field(item["status"], 40)
                  detail = escape_markdown_cell(item["detail"])
                  lines.append(f"| {name} | {url} | {status} | {detail} |")

              lines.extend([
                  "",
                  "### Status Meanings",
                  "",
                  "- **ONLINE**: `/v3/client_info` returned HTTP 200 with a valid JSON object containing non-empty `client_info` and `user_agent` strings and no error indicators.",
                  "- **OFFLINE**: Clear evidence that the service is unavailable (HTTP 5xx, proxy/5xx error page, DNS failure, connection refused/reset/aborted, remote disconnect, or timeout).",
                  "- **UNKNOWN**: Server health could not be confirmed (HTTP 3xx redirect, 401/403/429 access or rate limits, 4xx/other non-200 status, TLS/SSL error, empty/invalid/truncated response, JSON error or schema mismatch, or unexpected runtime error).",
                  "",
                  "### Health Check Limitations",
                  "",
                  "- Checks run once a week and are performed sequentially.",
                  "- Each server receives at most one HTTP GET request per run. Redirects are not followed; no retries or IP changes are performed.",
                  "- Only `/v3/client_info` is queried. The legacy `/` endpoint is intentionally not requested because it may generate one-time Anisette headers.",
                  "- `/v3/get_headers` and `/v3/provisioning_session` are never called.",
                  "- No Apple ID, credentials, cookies, or user sessions are used.",
                  "- No requests are sent to Apple. Apple authentication and provisioning are not tested.",
                  "- HTTP status codes, Content-Type, redirect locations, and available response bodies (capped at 8 KB with explicit truncation notice) are recorded. Sensitive values such as credentials, cookies, tokens, and private keys are redacted.",
                  "- HTTP 401, 403, and 429 are reported as UNKNOWN rather than proof that a server is offline. Access restrictions and rate limits are respected.",
                  "",
                  "**Important:** ONLINE means only that the `/v3/client_info` fail-closed check passed. It does not mean Apple has approved the server or guarantee successful SideStore authentication.",
                  "",
                  "<!-- SERVER_STATUS_END -->"
              ])
              return "\n".join(lines)


          def update_readme(readme_path, report):
              content = readme_path.read_text(encoding="utf-8")
              start_marker = "<!-- SERVER_STATUS_START -->"
              end_marker = "<!-- SERVER_STATUS_END -->"

              if (
                  start_marker in content
                  and end_marker in content
                  and content.index(start_marker) < content.index(end_marker)
              ):
                  start = content.index(start_marker)
                  end = content.index(end_marker) + len(end_marker)
                  updated = content[:start] + report + content[end:]
              else:
                  updated = content.rstrip() + "\n\n" + report + "\n"

              readme_path.write_text(updated, encoding="utf-8")


          def main():
              with open("servers.json", encoding="utf-8") as file:
                  servers = json.load(file)["servers"]

              results = []
              # Sequential checks: one GET per server, no retries, no IP changes.
              for server in servers:
                  try:
                      status, detail = check_server(server)
                  except Exception as error:
                      status, detail = classify_exception(error)
                  results.append({
                      "name": server.get("name", "(unnamed server)"),
                      "url": server.get("address", ""),
                      "status": status,
                      "detail": detail
                  })
                  print(f"  {status}: {detail}")

              checked_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
              report = build_report(results, checked_at)
              update_readme(Path("README.md"), report)
              print("README health status refreshed.")


          if __name__ == "__main__":
              main()
          PY

      - name: Commit weekly README status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi

          git commit -m "chore: update weekly server health status"
          git push
