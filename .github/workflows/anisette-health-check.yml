
name: Server Health Check

on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-servers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check servers and update README
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          import urllib.request
          import urllib.error
          import socket
          import ssl
          from pathlib import Path
          from urllib.parse import urlsplit

          TIMEOUT = 8
          USER_AGENT = "anisette-ss-health-check/2.0"

          def clean(value):
              value = str(value)
              value = re.sub(
                  r'(?i)(authorization|cookie|set-cookie|password|token)'
                  r'\s*[:=]\s*[^,\s;]+',
                  r'\1=[REDACTED]',
                  value
              )
              return (
                  value.replace("|", "/")
                       .replace("\r", " ")
                       .replace("\n", " ")
                       [:220]
              )

          def check_server(server):
              name = server["name"]
              base_url = server["address"].rstrip("/")
              endpoint = base_url + "/v3/client_info"

              print(f"Checking {name}: {base_url}")

              request = urllib.request.Request(
                  endpoint,
                  headers={"User-Agent": USER_AGENT},
                  method="GET"
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=TIMEOUT
                  ) as response:

                      status_code = response.status
                      body = response.read(65536)

                  try:
                      payload = json.loads(body.decode("utf-8"))
                  except (ValueError, UnicodeDecodeError):
                      payload = None

                  if (
                      status_code == 200
                      and isinstance(payload, dict)
                      and isinstance(payload.get("client_info"), str)
                      and payload["client_info"].strip()
                      and isinstance(payload.get("user_agent"), str)
                      and payload["user_agent"].strip()
                  ):
                      return (
                          "ONLINE",
                          "GET /v3/client_info: HTTP 200; "
                          "client_info and user_agent present. "
                          "Apple provisioning not tested."
                      )

                  return (
                      "DEGRADED",
                      f"HTTP {status_code}; "
                      "response is not valid V3 client_info JSON."
                  )

              except urllib.error.HTTPError as e:
                  reason = clean(e.reason)

                  if e.code == 404:
                      return (
                          "UNKNOWN",
                          f"HTTP ERROR 404 {reason}; "
                          "V3 endpoint not exposed. "
                          "Legacy endpoint was not queried."
                      )

                  if e.code in (401, 403, 429):
                      return (
                          "UNKNOWN",
                          f"HTTP ERROR {e.code} {reason}; "
                          "access restricted or rate limited. "
                          "No retry performed."
                      )

                  if e.code >= 500:
                      return (
                          "DEGRADED",
                          f"HTTP ERROR {e.code} {reason}"
                      )

                  return (
                      "DEGRADED",
                      f"HTTP ERROR {e.code} {reason}"
                  )

              except urllib.error.URLError as e:
                  reason = e.reason
                  detail = clean(
                      f"ERROR: URLError: {type(reason).__name__}: {reason}"
                  )

                  if isinstance(
                      reason,
                      (
                          socket.timeout,
                          TimeoutError,
                          ConnectionError,
                          socket.gaierror
                      )
                  ):
                      return "OFFLINE", detail

                  return "DEGRADED", detail

              except ssl.SSLError as e:
                  return (
                      "DEGRADED",
                      f"ERROR: SSLError: {clean(e)}"
                  )

              except Exception as e:
                  return (
                      "UNKNOWN",
                      f"ERROR: {type(e).__name__}: {clean(e)}"
                  )

          with open("servers.json", encoding="utf-8") as f:
              servers = json.load(f)["servers"]

          results = []

          # Sequential checks: no parallel requests and no retries.
          for server in servers:
              status, detail = check_server(server)

              results.append({
                  "name": server["name"],
                  "url": server["address"],
                  "status": status,
                  "detail": detail
              })

              print(f"  {status}: {detail}")

          lines = [
              "<!-- SERVER_STATUS_START -->",
              "## Server Status",
              "",
              "| Server | Address | Status | Details |",
              "|---|---|---|---|"
          ]

          for item in results:
              name = clean(item["name"])
              url = clean(item["url"])
              status = clean(item["status"])
              detail = clean(item["detail"])

              lines.append(
                  f"| {name} | {url} | {status} | {detail} |"
              )

          lines.extend([
              "",
              "### Status Meanings",
              "",
              "- **ONLINE**: V3 client information endpoint "
              "responded successfully with the required fields.",
              "- **DEGRADED**: Server responded, but the API "
              "or response had an error.",
              "- **OFFLINE**: Connection could not be established.",
              "- **UNKNOWN**: Insufficient information, unsupported "
              "endpoint, access restriction, or inconclusive result.",
              "",
              "### Health Check Limitations",
              "",
              "- Checks run once a week, sequentially, with no retries.",
              "- Each server receives at most one HTTP GET request.",
              "- Only `/v3/client_info` is queried. The legacy `/` "
              "endpoint is intentionally not requested because it "
              "may generate one-time Anisette headers.",
              "- `/v3/get_headers` and "
              "`/v3/provisioning_session` are never called.",
              "- No Apple ID, credentials, cookies, or user sessions "
              "are used.",
              "- No requests are sent to Apple.",
              "- Apple authentication and provisioning are not tested.",
              "- HTTP 401, 403, and 429 are not treated as proof "
              "that a server is offline.",
              "- Rate limits and access restrictions are respected. "
              "No retries or bypass attempts are made.",
              "",
              "**Important:** ONLINE does not guarantee successful "
              "SideStore authentication or Apple approval.",
              "",
              "<!-- SERVER_STATUS_END -->"
          ])

          report = "\n".join(lines)

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")

          start_marker = "<!-- SERVER_STATUS_START -->"
          end_marker = "<!-- SERVER_STATUS_END -->"

          if (
              start_marker in content
              and end_marker in content
              and content.index(start_marker) < content.index(end_marker)
          ):
              start = content.index(start_marker)
              end = content.index(end_marker) + len(end_marker)
              updated = content[:start] + report + content[end:]
          else:
              updated = content.rstrip() + "\n\n" + report + "\n"

          if updated != content:
              readme.write_text(updated, encoding="utf-8")
              print("README updated.")
          else:
              print("No changes. README remains unchanged.")
          PY

      - name: Commit README if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "chore: update server health status"
          git push
